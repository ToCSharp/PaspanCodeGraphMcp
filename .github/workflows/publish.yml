name: Publish NuGet Package to NuGet.org

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write # 🔑 CRITICAL: Allows GitHub to issue the OIDC token for NuGet

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    - name: Extract Version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Pack NuGet Package
      run: dotnet pack --configuration Release /p:PackageVersion=${{ env.VERSION }} --output ./artifacts

    # 🔄 Exchange the GitHub OIDC token for a short-lived NuGet API key
    - name: NuGet Login
      id: nuget_login
      uses: NuGet/login@v1

    # 🚀 Push using the dynamically generated temporary key
    - name: Push to NuGet.org
      run: |
        dotnet nuget push "./artifacts/*.nupkg" \
          --source "https://nuget.org" \
          --api-key "${{ steps.nuget_login.outputs.nuget-api-key }}" \
          --skip-duplicate