name: Publish NuGet Package to NuGet.org

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  deploy:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Extract Version
      shell: bash
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore -p:Version=${{ env.VERSION }}

    - name: Pack NuGet Package
      run: dotnet pack src/PaspanCodeGraphMcp/PaspanCodeGraphMcp.csproj --configuration Release --no-build -p:Version=${{ env.VERSION }} --output ./artifacts

    - name: NuGet Login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: tocsharp

    # On Windows NuGet only expands the wildcard with a backslash separator
    - name: Push to NuGet.org
      run: dotnet nuget push artifacts\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate